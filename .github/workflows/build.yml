name: Build My Calendar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK
        run: |
          SDKMANAGER=$(find /usr/local/lib/android -name sdkmanager -type f | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "SDK manager not found"
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH
          echo "SDKMANAGER=$SDKMANAGER" >> $GITHUB_ENV

      - name: Accept Android licenses
        run: yes | "$SDKMANAGER" --licenses || true

      - name: Install Android SDK
        run: |
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project
        run: unzip -q *.zip -d extracted

      - name: Build APK
        run: |
          cd extracted/MyCalendarWidget
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: MyCalendar-APK
          path: extracted/MyCalendarWidget/app/build/outputs/apk/debug/app-debug.apk
